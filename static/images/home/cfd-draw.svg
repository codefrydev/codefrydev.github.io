<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CFD Draw">
  <defs>
    <!-- Vibrant colorful gradient for the drawing stroke -->
    <linearGradient id="drawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54" />
      <stop offset="50%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .draw-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawLine 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pencil-group {
      animation: movePencil 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 320px 240px;
    }
    @keyframes drawLine {
      0%, 10% { stroke-dashoffset: 600; opacity: 0; }
      15% { opacity: 1; }
      50%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes movePencil {
      0%, 10% { transform: translate(-100px, 120px) rotate(-15deg); opacity: 0; }
      12% { opacity: 1; }
      50% { transform: translate(110px, -70px) rotate(15deg); opacity: 1; }
      55%, 100% { transform: translate(110px, -70px) rotate(15deg); opacity: 0; }
    }
  </style>

  <!-- Background card -->
  <rect width="512" height="512" rx="120" fill="#F43F5E" />

  <!-- Drawing Board / Paper -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Grid dots background for drawing canvas -->
  <g fill="#FDA4AF" opacity="0.35">
    <circle cx="140" cy="140" r="4" />
    <circle cx="200" cy="140" r="4" />
    <circle cx="260" cy="140" r="4" />
    <circle cx="320" cy="140" r="4" />
    <circle cx="380" cy="140" r="4" />

    <circle cx="140" cy="200" r="4" />
    <circle cx="200" cy="200" r="4" />
    <circle cx="260" cy="200" r="4" />
    <circle cx="320" cy="200" r="4" />
    <circle cx="380" cy="200" r="4" />

    <circle cx="140" cy="260" r="4" />
    <circle cx="200" cy="260" r="4" />
    <circle cx="260" cy="260" r="4" />
    <circle cx="320" cy="260" r="4" />
    <circle cx="380" cy="260" r="4" />

    <circle cx="140" cy="320" r="4" />
    <circle cx="200" cy="320" r="4" />
    <circle cx="260" cy="320" r="4" />
    <circle cx="320" cy="320" r="4" />
    <circle cx="380" cy="320" r="4" />

    <circle cx="140" cy="380" r="4" />
    <circle cx="200" cy="380" r="4" />
    <circle cx="260" cy="380" r="4" />
    <circle cx="320" cy="380" r="4" />
    <circle cx="380" cy="380" r="4" />
  </g>

  <!-- Drawn line -->
  <path class="draw-path" d="M 140 340 C 200 240, 240 180, 320 280 S 370 140, 400 160" stroke="url(#drawGrad)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#soft-glow)" />

  <!-- Pencil / Stylus -->
  <g class="pencil-group">
    <!-- Stylus / Pencil body -->
    <path d="M 170 320 L 290 200 C 295 195, 305 195, 310 200 L 320 210 C 325 215, 325 225, 320 230 L 200 350 Z" fill="#E11D48" />
    <!-- Eraser or top cap -->
    <path d="M 310 200 L 320 210 L 330 200 C 335 195, 335 185, 330 180 L 320 170 C 315 165, 305 165, 300 170 Z" fill="#FDA4AF" />
    <!-- Wood section near tip -->
    <path d="M 170 320 L 140 340 L 200 350 Z" fill="#FDE047" />
    <!-- Graphite / Pencil Lead tip -->
    <path d="M 150 333 L 140 340 L 160 347 Z" fill="#334155" />
    <!-- Highlights and design lines on pencil -->
    <line x1="205" y1="285" x2="285" y2="205" stroke="#FFFFFF" stroke-width="3" opacity="0.3" stroke-linecap="round" />
  </g>
</svg>
