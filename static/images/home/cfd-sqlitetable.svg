<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#52d1c6"/>
<stop offset="100%" stop-color="#3a7bd5"/>
</linearGradient>

<linearGradient id="table_bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#34d399"/>
<stop offset="100%" stop-color="#059669"/>
</linearGradient>
</defs>

<!-- database body -->
<path d="M22 25 v55 c0 7 17 12 38 12 s38-5 38-12 v-55" fill="url(#body)"/>
<ellipse cx="60" cy="80" rx="38" ry="12" fill="#2b6cb0" opacity="0.55"/>
<ellipse cx="60" cy="25" rx="38" ry="12" fill="url(#body)"/>

<!-- table over the database -->
<rect x="35" y="35" width="50" height="35" rx="4" fill="url(#table_bg)"/>
<!-- table grid -->
<line x1="35" y1="46" x2="85" y2="46" stroke="white" stroke-width="2" opacity="0.8"/>
<line x1="35" y1="58" x2="85" y2="58" stroke="white" stroke-width="2" opacity="0.8"/>
<line x1="51" y1="35" x2="51" y2="70" stroke="white" stroke-width="2" opacity="0.8"/>
<line x1="68" y1="35" x2="68" y2="70" stroke="white" stroke-width="2" opacity="0.8"/>
</svg>
