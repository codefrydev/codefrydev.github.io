<line x1="30" y1="40" x2="90" y2="70" stroke="#6ee7b7" stroke-width="4"/>
<line x1="90" y1="70" x2="50" y2="90" stroke="#6ee7b7" stroke-width="4"/>

<!-- Nodes -->
<rect x="15" y="30" width="30" height="20" rx="4" fill="url(#node_bg)"/>
<rect x="65" y="15" width="30" height="20" rx="4" fill="url(#node_bg)"/>
<rect x="75" y="60" width="30" height="20" rx="4" fill="url(#node_bg)"/>
<rect x="35" y="80" width="30" height="20" rx="4" fill="url(#node_bg)"/>
</svg>
