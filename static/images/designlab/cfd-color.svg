<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Clean bright squircle background with crisp border -->
  <rect width="512" height="512" rx="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="10"/>

  <defs>
    <!-- Strand 1: Warm Vibrant Spectrum -->
    <linearGradient id="strand_left_dl" x1="160" y1="90" x2="352" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Strand 2: Cool Ocean Cyan-Blue Spectrum -->
    <linearGradient id="strand_right_dl" x1="352" y1="90" x2="160" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Horizontal connecting base-pair rungs -->
  <line x1="175" y1="110" x2="337" y2="110" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <line x1="210" y1="183" x2="302" y2="183" stroke="#eab308" stroke-width="12" stroke-linecap="round"/>
  <line x1="244" y1="256" x2="268" y2="256" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
  <line x1="210" y1="329" x2="302" y2="329" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
  <line x1="175" y1="402" x2="337" y2="402" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>

  <!-- Left Helical Ribbon -->
  <path d="M 160 90 C 160 170, 352 176, 352 256 C 352 336, 160 342, 160 422" stroke="url(#strand_left_dl)" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Right Helical Ribbon -->
  <path d="M 352 90 C 352 170, 160 176, 160 256 C 160 336, 352 342, 352 422" stroke="url(#strand_right_dl)" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Helix Swatch Nodes -->
  <circle cx="160" cy="90" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
  <circle cx="352" cy="90" r="18" fill="#06b6d4" stroke="#ffffff" stroke-width="6"/>

  <circle cx="256" cy="256" r="20" fill="#10b981" stroke="#ffffff" stroke-width="6"/>

  <circle cx="160" cy="422" r="18" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
  <circle cx="352" cy="422" r="18" fill="#1d4ed8" stroke="#ffffff" stroke-width="6"/>
</svg>
