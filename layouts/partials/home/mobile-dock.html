<aside id="cfd-mobile-dock" class="cfd-mobile-dock lg:hidden fixed bottom-3 inset-x-3 sm:inset-x-6 z-40 max-w-sm mx-auto" aria-label="Mobile quick actions">
  <div class="cfd-mobile-dock__inner bg-slate-900/90 dark:bg-slate-950/90 text-white backdrop-blur-xl border border-white/15 dark:border-slate-800 rounded-2xl shadow-2xl p-1 flex items-center justify-around">
    <a href="{{ "/" | relLangURL }}" class="cfd-mobile-dock__btn{{ if .IsHome }} is-active{{ end }}" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="{{ "/browse/" | relLangURL }}" class="cfd-mobile-dock__btn{{ if eq (.Scratch.Get "navActive") "browse" }} is-active{{ end }}" aria-label="Browse Directory">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Browse</span>
    </a>
    <button type="button" class="cfd-mobile-dock__btn cfd-mobile-dock__btn--search" data-search-open aria-label="Search all tools">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <a href="{{ if .IsHome }}#cfd-favorites-tray{{ else }}{{ "/browse/?filter=favorites" | relLangURL }}{{ end }}" id="cfd-dock-fav-link" class="cfd-mobile-dock__btn relative" aria-label="Saved Tools">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span id="cfd-dock-fav-badge" class="cfd-mobile-dock__badge hidden" aria-hidden="true">0</span>
      <span>Saved</span>
    </a>
    <button type="button" class="cfd-mobile-dock__btn" data-cfd-lucky-btn aria-label="Surprise Me">
      <span class="text-base leading-none" aria-hidden="true">🎲</span>
      <span>Surprise</span>
    </button>
  </div>
</aside>
